<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; img-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>Local 3D Studio | Model viewer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: #15232a;
      background: #f3f4ef;
      --border: #d4dad3;
      --muted: #51615e;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }

    .shell {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
      padding: 45px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: -.055em;
    }

    p { margin: 0; }
    .intro { margin-top: 10px; color: var(--muted); }
    .actions, .presets { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: .91rem;
      font-weight: 620;
      cursor: pointer;
      background: #fcfdf9;
      color: #15232a;
    }

    button:hover:not(:disabled) { background: #e7ede5; }
    button:focus-visible { outline: 3px solid #437866; outline-offset: 3px; }
    button:disabled { opacity: .46; cursor: default; }

    .open {
      min-height: 47px;
      padding-inline: 19px;
      color: #fff;
      border-color: #264638;
      background: #264638;
    }

    .open:hover:not(:disabled) { background: #365e4b; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 270px);
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fcfdf9;
      box-shadow: 0 16px 40px #182b2011;
    }

    .viewport {
      position: relative;
      min-height: 460px;
      isolation: isolate;
      background-color: #e8eee7;
      background-image:
        linear-gradient(#5b776b14 1px, transparent 1px),
        linear-gradient(90deg, #5b776b14 1px, transparent 1px),
        radial-gradient(ellipse at center, #f3f6ef, #dce7dd);
      background-position: center;
      background-size: 26px 26px, 26px 26px, auto;
    }

    model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      pointer-events: none;
      text-align: center;
    }

    .message > div {
      max-width: 360px;
      padding: 16px 20px;
      border: 1px solid #ccd7ca;
      border-radius: 12px;
      background: #f7faf2f5;
    }

    .message strong { display: block; margin-bottom: 6px; }
    .message p, .sidebar p { color: var(--muted); font-size: .9rem; line-height: 1.55; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 25px 22px;
      border-left: 1px solid var(--border);
    }

    .sidebar h2 { margin: 0 0 7px; font-size: .95rem; }
    #model-name { overflow-wrap: anywhere; }
    #demo-details { display: inline-block; margin-top: 7px; color: #264638; font-size: .86rem; }
    .presets button { min-width: 62px; }
    .hint { padding-top: 20px; border-top: 1px solid var(--border); }

    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); padding: 26px 0; }
      header { align-items: start; flex-direction: column; gap: 16px; }
      .workspace { grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .viewport { min-height: min(62vh, 450px); }
      .sidebar { gap: 14px; border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Local 3D Studio</h1>
        <p class="intro">Preview a reconstructed mesh in your browser.</p>
      </div>
      <div class="actions">
        <button type="button" id="open-demo" disabled>Load real-person demo</button>
        <button type="button" class="open" id="open-file">Open GLB</button>
        <input type="file" id="file" accept=".glb,model/gltf-binary" hidden>
      </div>
    </header>
    <div class="workspace">
      <section class="viewport" aria-label="3D viewport">
        <model-viewer
          id="viewer" alt="3D preview of the selected mesh" camera-controls
          touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.9"
          camera-orbit="20deg 78deg auto" loading="eager">
        </model-viewer>
        <div class="message" id="message">
          <div>
            <strong id="message-title">Opening viewer</strong>
            <p id="message-detail">The viewport requires a browser with WebGL.</p>
          </div>
        </div>
      </section>
      <aside class="sidebar" aria-label="Model details and controls">
        <div>
          <h2>Model</h2>
          <p id="model-name" role="status" aria-live="polite">No model loaded</p>
          <a href="https://github.com/yuanrui3/local-3d-studio/blob/main/docs/real-person-demo.md" id="demo-details" hidden>Photo credit and demo details</a>
        </div>
        <div>
          <h2>Camera</h2>
          <div class="presets">
            <button type="button" data-orbit="0deg 90deg auto" disabled>Front</button>
            <button type="button" data-orbit="90deg 90deg auto" disabled>Side</button>
            <button type="button" data-orbit="180deg 90deg auto" disabled>Back</button>
            <button type="button" data-orbit="20deg 78deg auto" disabled>Reset</button>
          </div>
        </div>
        <p class="hint">Drag to orbit. Scroll or pinch to zoom. A file you open stays in this browser.</p>
      </aside>
    </div>
    <noscript><p>Enable JavaScript to use the model viewer.</p></noscript>
  </main>
  <script type="module">
    const viewer = document.querySelector("#viewer");
    const file = document.querySelector("#file");
    const open = document.querySelector("#open-file");
    const openDemo = document.querySelector("#open-demo");
    const demoDetails = document.querySelector("#demo-details");
    const modelName = document.querySelector("#model-name");
    const message = document.querySelector("#message");
    const title = document.querySelector("#message-title");
    const detail = document.querySelector("#message-detail");
    const presets = document.querySelectorAll("[data-orbit]");
    const defaultModel = "outputs/reconstruction/model.glb";
    const demoModel = "docs/assets/real-person-demo.glb";
    const demoUrl = new URL(demoModel, location.href);
    let objectUrl;
    let currentName;

    function showMessage(heading, description) {
      title.textContent = heading;
      detail.textContent = description;
      message.hidden = false;
    }

    function setControls(enabled) {
      for (const button of presets) button.disabled = !enabled;
    }

    function load(source, name, isDemo = false) {
      if (viewer.src === source && message.hidden) return;
      currentName = name;
      demoDetails.hidden = !isDemo;
      setControls(false);
      modelName.textContent = "Loading " + name;
      showMessage("Loading model", name);
      viewer.src = source;
    }

    function loadServerModel(model) {
      const url = new URL(model, location.href);
      if (url.origin !== location.origin || !url.pathname.toLowerCase().endsWith(".glb")) {
        throw new Error("Use a .glb path served by the same local server.");
      }
      const isDemo = url.pathname === demoUrl.pathname;
      const name = isDemo ? "Real-person reconstruction" : decodeURIComponent(url.pathname.split("/").pop());
      load(url.href, name, isDemo);
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = undefined;
      }
    }

    openDemo.addEventListener("click", () => loadServerModel(demoModel));
    open.addEventListener("click", () => file.click());
    file.addEventListener("change", () => {
      const selected = file.files[0];
      file.value = "";
      if (!selected) return;
      if (!selected.name.toLowerCase().endsWith(".glb")) {
        modelName.textContent = "Choose a .glb model.";
        return;
      }
      const previous = objectUrl;
      objectUrl = URL.createObjectURL(selected);
      load(objectUrl, selected.name);
      if (previous) URL.revokeObjectURL(previous);
    });

    viewer.addEventListener("load", () => {
      modelName.textContent = currentName;
      message.hidden = true;
      setControls(true);
    });

    viewer.addEventListener("error", event => {
      modelName.textContent = "Could not load " + (currentName || "model");
      setControls(false);
      if (event.detail?.type === "webglcontextlost") {
        showMessage("WebGL unavailable", "Reload the page or try a browser with hardware acceleration.");
        return;
      }
      showMessage("Model unavailable", "Load the included demo, open a local .glb file, or verify the model path.");
    });

    for (const button of presets) {
      button.addEventListener("click", () => {
        viewer.cameraOrbit = button.dataset.orbit;
        viewer.cameraTarget = "auto auto auto";
        viewer.fieldOfView = "auto";
      });
    }

    try {
      await import("./vendor/web/model-viewer.min.js");
      openDemo.disabled = false;
      loadServerModel(new URLSearchParams(location.search).get("model") || defaultModel);
    } catch (error) {
      showMessage("Viewer could not start", error.message);
    }
  </script>
</body>
</html>
